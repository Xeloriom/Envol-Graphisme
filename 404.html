<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 – Page introuvable | Envol Graphisme</title>
    <meta name="description" content="Oups ! Cette page s'est envolée. Retournez à l'accueil d'Envol Graphisme.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="img/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { min-height: 100%; overflow-x: hidden; }
        body { background: linear-gradient(160deg, #111827 0%, #1a2845 40%, #1a2332 100%); }

        .star-field span {
            position: absolute; border-radius: 50%; background: #fff; pointer-events: none;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.8); }
        }

        .shooting-star {
            position: absolute; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0), #CB8D30 60%, rgba(255,255,255,0));
            border-radius: 999px; opacity: 0; animation: shoot 5s linear infinite;
        }
        .shooting-star:nth-child(1) { width:140px; top:15%; left:-140px; transform:rotate(18deg); animation-delay:0s; }
        .shooting-star:nth-child(2) { width:100px; top:40%; left:-140px; transform:rotate(12deg); animation-delay:2.2s; }
        .shooting-star:nth-child(3) { width:160px; top:68%; left:-140px; transform:rotate(22deg); animation-delay:4s; }
        @keyframes shoot {
            0%   { left:-160px; opacity:0; }
            8%   { opacity:1; }
            88%  { opacity:1; }
            100% { left:115vw; opacity:0; }
        }

        /* Image 404 flottante */
        .img-404 {
            filter: drop-shadow(0 20px 60px rgba(203,141,48,0.25));
            animation: img-float 4.5s ease-in-out infinite;
        }
        @keyframes img-float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-14px); }
        }

        /* Boutons */
        .btn-primary {
            background: linear-gradient(135deg, #CB8D30, #e0a94a);
            color: #fff; font-weight: 700;
            padding: 1rem 2.2rem; border-radius: 9999px;
            font-size: clamp(0.88rem, 2vw, 1.05rem);
            letter-spacing: 0.05em; transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 0.4rem;
            text-decoration: none;
            box-shadow: 0 4px 24px rgba(203,141,48,0.45);
        }
        .btn-primary:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 30px rgba(203,141,48,0.65); }

        .btn-secondary {
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.85);
            border: 1.5px solid rgba(255,255,255,0.2);
            font-weight: 600; padding: 1rem 2.2rem; border-radius: 9999px;
            font-size: clamp(0.88rem, 2vw, 1.05rem);
            letter-spacing: 0.04em; transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 0.4rem;
            text-decoration: none; backdrop-filter: blur(8px);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); transform: translateY(-3px); }

        /* Particules */
        .particle {
            position: absolute; border-radius: 50%; pointer-events: none;
            animation: particle-drift linear infinite;
        }
        @keyframes particle-drift {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="text-white" id="bienvenue">

<!-- Fond étoilé -->
<div class="star-field fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true" id="stars"></div>
<div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
</div>
<div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true" id="particles"></div>

<!-- Navbar -->
<script src="js/navbar.js"></script>

<main class="relative min-h-screen flex flex-col items-center justify-center
             px-5 pt-24 pb-10 text-center z-10 gap-6 sm:gap-8"
      id="main-content">

    <!-- Image 404 FR/EN (switch par JS) -->
    <div id="err-img" class="img-404 opacity-0 w-full max-w-[320px] sm:max-w-[420px] md:max-w-[500px] lg:max-w-[560px]">
        <img id="img-fr" src="img/Erreur%20404_FR.webp"
             alt="Erreur 404 – Cette page s'est envolée"
             class="w-full h-auto select-none" loading="eager">
        <img id="img-en" src="img/Erreur%20404_ENG.webp"
             alt="Error 404 – This page has flown away"
             class="w-full h-auto select-none hidden" loading="eager">
    </div>

    <!-- Boutons -->
    <div id="err-cta" class="flex flex-col sm:flex-row gap-4 opacity-0">
        <a href="/Envol-Graphisme/index.html"
           class="btn-primary"
           data-i18n="err_home">
            ✦ Retour à l'accueil
        </a>
        <a href="/Envol-Graphisme/View/Contact.html"
           class="btn-secondary"
           data-i18n="err_contact">
            Me contacter
        </a>
    </div>

    <!-- Logo bas -->
    <a href="/Envol-Graphisme/index.html"
       id="err-logo"
       class="mt-4 transition-opacity duration-300 opacity-0"
       style="opacity:0">
        <img src="img/ENVOL%20Graphisme%20Logo%20clair.webp"
             alt="Envol Graphisme"
             class="h-8 sm:h-10 mx-auto"
             loading="lazy">
    </a>

</main>

<!-- Footer -->
<script src="js/footer.js"></script>
<style>footer { margin-top: 0 !important; }</style>

<!-- i18n -->
<script src="i18n/i18n.js"></script>

<script>
// ── Étoiles
var starsEl = document.getElementById('stars');
for (var i = 0; i < 110; i++) {
    var s = document.createElement('span');
    var sz = Math.random() * 2.5 + 0.5;
    s.style.cssText =
        'width:'+sz+'px;height:'+sz+'px;' +
        'left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;' +
        'opacity:'+(Math.random()*0.55+0.1)+';' +
        'animation:twinkle '+(Math.random()*4+2)+'s ease-in-out infinite;' +
        'animation-delay:'+(Math.random()*4)+'s;';
    starsEl.appendChild(s);
}

// ── Particules dorées
var particlesEl = document.getElementById('particles');
var COLORS = ['rgba(203,141,48,0.55)','rgba(222,227,246,0.35)','rgba(203,141,48,0.28)'];
for (var j = 0; j < 20; j++) {
    var p = document.createElement('div');
    var psz = Math.random() * 5 + 2;
    var dur = Math.random() * 14 + 8;
    p.className = 'particle';
    p.style.cssText =
        'width:'+psz+'px;height:'+psz+'px;' +
        'left:'+Math.random()*100+'%;bottom:'+(Math.random()*20)+'%;' +
        'background:'+COLORS[Math.floor(Math.random()*COLORS.length)]+';' +
        'animation-duration:'+dur+'s;animation-delay:'+(Math.random()*dur)+'s;';
    particlesEl.appendChild(p);
}

// ── Switch image selon langue
function applyLang404(lang) {
    var imgFr = document.getElementById('img-fr');
    var imgEn = document.getElementById('img-en');
    if (lang === 'en') {
        imgFr.classList.add('hidden');
        imgEn.classList.remove('hidden');
    } else {
        imgEn.classList.add('hidden');
        imgFr.classList.remove('hidden');
    }
}
// Langue initiale
var initLang = (typeof localStorage !== 'undefined' && localStorage.getItem('envol-lang')) || 'fr';
applyLang404(initLang);
// Switch sur changement
document.addEventListener('langchange', function(e) { applyLang404(e.detail.lang); });

// ── GSAP entrance
document.addEventListener('DOMContentLoaded', function() {
    gsap.fromTo('#err-img',  { opacity:0, y:30, scale:0.92 }, { opacity:1, y:0, scale:1, duration:0.9, ease:'back.out(1.4)', delay:0.3 });
    gsap.fromTo('#err-cta',  { opacity:0, y:20 }, { opacity:1, y:0, duration:0.7, ease:'power3.out', delay:0.9 });
    gsap.to('#err-logo', { opacity:0.45, duration:0.6, delay:1.3 });

    // Loader
    var l = document.getElementById('page-loader');
    if (l) { l.classList.add('loader-out'); setTimeout(function(){ if(l.parentNode) l.parentNode.removeChild(l); }, 900); }
});
</script>
</body>
</html>
