<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 – Page introuvable | Envol Graphisme</title>
    <meta name="description" content="Oups ! Cette page s'est envolée. Retournez à l'accueil d'Envol Graphisme.">
    <meta name="robots" content="noindex, nofollow">
    <!-- Base dynamique : GitHub Pages sert 404.html depuis n'importe quelle URL,
         ce script doit être le PREMIER élément du head pour que tous les
         chemins relatifs suivants soient résolus depuis la racine du repo. -->
    <script>
    (function(){
        var b = document.createElement('base');
        b.href = window.location.hostname.includes('github.io')
            ? 'https://xeloriom.github.io/Envol-Graphisme/'
            : window.location.origin + '/ENVOLGraphisme/';
        document.head.appendChild(b);
    })();
    </script>
    <link rel="icon" type="image/png" href="img/Insigne.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { min-height: 100%; overflow-x: hidden; }
        body { background: #1a2332; }

        .btn-primary {
            background: linear-gradient(135deg, #CB8D30, #e0a94a);
            color: #fff; font-weight: 700;
            padding: 0.9rem 2rem; border-radius: 9999px;
            font-size: clamp(0.88rem, 2vw, 1rem);
            letter-spacing: 0.05em; transition: all 0.25s;
            display: inline-flex; align-items: center; gap: 0.4rem;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(203,141,48,0.35);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(203,141,48,0.55); }

        .btn-secondary {
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.8);
            border: 1.5px solid rgba(255,255,255,0.18);
            font-weight: 600; padding: 0.9rem 2rem; border-radius: 9999px;
            font-size: clamp(0.88rem, 2vw, 1rem);
            letter-spacing: 0.04em; transition: all 0.25s;
            display: inline-flex; align-items: center; gap: 0.4rem;
            text-decoration: none;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.13); transform: translateY(-2px); }
    </style>
</head>
<body class="text-white" id="bienvenue">

<main class="relative min-h-screen flex flex-col items-center justify-center
             px-5 pt-8 pb-8 text-center z-10 gap-6"
      id="main-content">

    <!-- Image 404 qui switch FR/EN -->
    <div class="w-full max-w-[420px] sm:max-w-[620px] md:max-w-[800px]">
        <img id="img-fr"
             src="img/Erreur%20404_FR.webp"
             alt="Erreur 404 – Cette page s'est envolée"
             class="w-full h-auto select-none drop-shadow-2xl"
             loading="eager">
        <img id="img-en"
             src="img/Erreur%20404_ENG.webp"
             alt="Error 404 – This page has flown away"
             class="w-full h-auto select-none drop-shadow-2xl hidden"
             loading="eager">
    </div>

    <!-- Boutons -->
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
        <a href="index.html"
           class="btn-primary"
           data-i18n="err_home">✦ Retour à l'accueil</a>
        <a href="View/Contact.html"
           class="btn-secondary"
           data-i18n="err_contact">Me contacter</a>
    </div>

    <!-- Logo -->
    <a href="index.html" class="mt-2 opacity-40 hover:opacity-80 transition-opacity duration-300">
        <img src="img/ENVOL%20Graphisme%20Logo%20clair.webp"
             alt="Envol Graphisme"
             class="h-8 sm:h-10 mx-auto" loading="lazy">
    </a>

</main>

<script src="i18n/i18n.js"></script>

<script>
function applyLang404(lang) {
    document.getElementById('img-fr').classList.toggle('hidden', lang === 'en');
    document.getElementById('img-en').classList.toggle('hidden', lang !== 'en');
}
var initLang = (typeof localStorage !== 'undefined' && localStorage.getItem('envol-lang')) || 'fr';
applyLang404(initLang);
document.addEventListener('langchange', function(e) { applyLang404(e.detail.lang); });

var l = document.getElementById('page-loader');
if (l) { l.classList.add('loader-out'); setTimeout(function(){ if(l.parentNode) l.parentNode.removeChild(l); }, 900); }
</script>
</body>
</html>
