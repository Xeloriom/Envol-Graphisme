<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envol Graphisme - Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="../style.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
</head>
<body id="bienvenue" class="">

<!-- La navigation sera injectée ici par navbar.js -->

<!-- Hero Section Contact -->
<!-- Hero Section Contact -->
<section class="relative px-6 overflow-hidden bg-gradient-to-b from-[#2A3B5C] to-[#3D4F6E]">

    <!-- Fond ciel étoilé -->
    <div class="absolute inset-0 bg-[url('../img/Illustrationcielétoilé.svg')] bg-cover bg-center
                [mask-image:linear-gradient(to_top,rgba(0,0,0,100),rgba(0,0,0,90))]
                [-webkit-mask-image:linear-gradient(to_top,rgba(0,0,0,100),rgba(0,0,0,100))]">
    </div>

    <div class="relative z-10 max-w-8xl mx-auto flex flex-col items-center justify-center h-screen mt-32 md:mt-0 px-4 text-center space-y-6 md:space-y-8">

        <!-- Titre principal -->
        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl text-white font-bold leading-snug md:leading-tight">
            Vous avez un projet en tête ?<br>
            Une envie de faire décoller votre identité visuelle ?
        </h1>

        <!-- Sous-titre -->
        <p class="text-xl sm:text-2xl md:text-3xl lg:text-4xl text-white/80 font-normal leading-snug md:leading-tight">
            N'hésitez pas à me laisser un message ou à passer par mes réseaux !
        </p>

        <!-- Zone boutons + chouette -->
        <div class="relative flex flex-col md:flex-row items-center justify-center gap-6 md:gap-20 pt-16 md:pt-32 w-full">

            <!-- Bouton M'écrire -->
            <a href="#form"
               class="bg-[#7B94C8] hover:bg-[#6A83B7] text-white font-bold px-10 sm:px-16 md:px-20 py-4 sm:py-5 md:py-7 rounded-full text-lg sm:text-xl md:text-2xl transition shadow-lg z-10">
                M'ÉCRIRE MAINTENANT
            </a>

            <!-- Bouton Réseaux -->
            <a href="#social"
               class="bg-[#7B94C8] hover:bg-[#6A83B7] text-white font-bold px-10 sm:px-16 md:px-20 py-4 sm:py-5 md:py-7 rounded-full text-lg sm:text-xl md:text-2xl transition shadow-lg z-10">
                RÉSEAUX-SOCIAUX
            </a>

            <!-- Chouette par-dessus -->
            <img src="../img/Chouetteailesouvertes.svg"
                 alt="Chouette ailes ouvertes"
                 class="pointer-events-none select-none absolute left-1/2 -translate-x-1/2
                        top-[60%] sm:top-[55%] md:top-[50%] lg:top-[48%] xl:top-[45%]
                        w-[70%] sm:w-[60%] md:w-[50%] lg:w-[40%] xl:w-[35%] z-0">
        </div>
    </div>
</section>

<script src="../js/navbar.js"></script>
<script src="../js/footer.js"></script>
<script src="../js/Parallax.js"></script>
<script src="../js/owl-FAQ.js"></script>
<script src="../js/testimonial-slide.js"></script>
<script src="../i18n/i18n.js"></script>
<script src="../js/Swiper.js"></script>
</body>
</html>
