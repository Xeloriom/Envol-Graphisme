<body id="bienvenue" class="overflow-x-hidden">

<a href="#main-content" class="skip-link">Aller au contenu principal</a>

<section id="main-content"
         class="relative min-h-screen px-6 overflow-hidden
                bg-gradient-to-b from-[#2A3B5C] to-[#3D4F6E]
                flex items-center justify-center">

    <!-- Fond étoilé -->
    <div class="absolute inset-0
                bg-[url('../img/Illustrationcielétoilé.jpg')] bg-cover bg-center
                [mask-image:linear-gradient(to_top,rgba(0,0,0,1),rgba(0,0,0,0.9))]
                [-webkit-mask-image:linear-gradient(to_top,rgba(0,0,0,1),rgba(0,0,0,1))]"
         aria-hidden="true">
    </div>

    <div class="relative z-10 max-w-5xl mx-auto flex flex-col items-center justify-center
                py-20 md:py-0 px-4 text-center space-y-6 md:space-y-8">

        <h1 id="contact-title"
            class="text-[clamp(1.5rem,5vw,4.5rem)] text-white font-bold leading-snug md:leading-tight"
            data-aos="fade-down">
            Vous avez un projet en tête ?<br>
            Une envie de faire décoller votre identité visuelle ?
        </h1>

        <p class="text-[clamp(1rem,3vw,2.5rem)] text-white/80 font-normal leading-snug"
           data-aos="fade-up" data-aos-delay="150">
            N'hésitez pas à me laisser un message ou à passer par mes réseaux !
        </p>

        <div class="relative flex flex-col sm:flex-row items-center justify-center
                    gap-6 sm:gap-10 md:gap-20 pt-12 md:pt-24 w-full"
             data-aos="zoom-in" data-aos-delay="300">

            <a href="mailto:envol.graphisme@gmail.com"
               class="w-full sm:w-auto bg-[#7B94C8] hover:bg-[#6A83B7] text-white font-bold
                      px-8 sm:px-16 py-4 sm:py-6 rounded-full
                      text-[clamp(0.9rem,2vw,1.5rem)] transition-all duration-300 shadow-lg z-10
                      hover:scale-105 hover:shadow-[0_0_30px_rgba(123,148,200,0.5)]">
                M'ÉCRIRE MAINTENANT
            </a>

            <a href="#social"
               class="w-full sm:w-auto bg-[#7B94C8] hover:bg-[#6A83B7] text-white font-bold
                      px-8 sm:px-16 py-4 sm:py-6 rounded-full
                      text-[clamp(0.9rem,2vw,1.5rem)] transition-all duration-300 shadow-lg z-10
                      hover:scale-105 hover:shadow-[0_0_30px_rgba(123,148,200,0.5)]">
                RÉSEAUX SOCIAUX
            </a>

            <img src="../img/Chouetteailesouvertes.svg"
                 alt=""
                 class="pointer-events-none select-none absolute left-1/2 -translate-x-1/2
                        top-[40%] sm:top-[42%] md:top-[45%]
                        w-[85%] sm:w-[65%] md:w-[55%] lg:w-[42%] xl:w-[32%] z-0"
                 loading="lazy" aria-hidden="true">
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    gsap.from('#contact-title', {
        duration: 1.2,
        y: 50,
        opacity: 0,
        ease: 'power3.out',
        delay: 0.3
    });
});
</script>
