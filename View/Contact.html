<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact – Envol Graphisme | Demandez votre devis gratuit</title>
    <meta name="description" content="Contactez Envol Graphisme pour votre projet de design graphique. Logo, identité visuelle, affiche, flyer… Devis gratuit et réponse rapide.">
    <meta name="keywords" content="contact graphiste, devis design graphique, Envol Graphisme contact">
    <meta name="author" content="Envol Graphisme">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://Xeloriom.github.io/Envol-Graphisme/View/Contact.html">
    <meta property="og:type"        content="website">
    <meta property="og:title"       content="Contact – Envol Graphisme">
    <meta property="og:description" content="Vous avez un projet ? Contactez Envol Graphisme pour un devis gratuit.">
    <meta property="og:image"       content="https://Xeloriom.github.io/Envol-Graphisme/img/ENVOL%20Graphisme%20Logo%20clair.png">
    <meta property="og:url"         content="https://Xeloriom.github.io/Envol-Graphisme/View/Contact.html">
    <meta property="og:locale"      content="fr_FR">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="Contact – Envol Graphisme">
    <meta name="twitter:image"       content="https://Xeloriom.github.io/Envol-Graphisme/img/ENVOL%20Graphisme%20Logo%20clair.png">
    <link rel="icon" type="image/png" href="../img/Insigne.png">
    <link rel="apple-touch-icon"      href="../img/Insigne.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind.config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body id="bienvenue" class="overflow-x-hidden"
      style="background:#1a2332;">

<!-- Fond étoilé global (couvre section + footer) -->
<div class="fixed inset-0 -z-10 bg-[url('../img/Illustrationcielétoilé.webp')] bg-cover bg-center opacity-90"
     aria-hidden="true"></div>
<div class="fixed inset-0 -z-10 bg-gradient-to-t from-[#1a2332]/80 via-transparent to-[#1a2332]/40"
     aria-hidden="true"></div>

<a href="#main-content" class="skip-link">Aller au contenu principal</a>

<section id="main-content"
         class="relative min-h-screen flex flex-col overflow-hidden">

    <!-- Zone texte + boutons : occupe la partie haute -->
    <div class="relative z-20 flex-1 flex flex-col items-center justify-center
                text-center px-5 sm:px-8 pt-24 pb-6 sm:pb-10">

        <h1 id="contact-h1"
            data-i18n="contact_h1"
            class="text-[clamp(1.55rem,5vw,3.5rem)] text-white font-bold leading-tight opacity-0 max-w-3xl">
            Vous avez un projet en tête&nbsp;?<br class="hidden sm:block">
            Une envie de faire décoller votre identité visuelle&nbsp;?
        </h1>

        <p id="contact-sub"
           data-i18n="contact_sub"
           class="mt-5 sm:mt-7 text-[clamp(0.9rem,2.2vw,1.6rem)] text-white/80
                  font-normal leading-relaxed max-w-xl opacity-0">
            N'hésitez pas à me laisser un message ou à passer par mes réseaux&nbsp;!
        </p>

        <div id="contact-btns"
             class="mt-9 sm:mt-12 flex flex-col sm:flex-row items-center justify-center
                    gap-4 sm:gap-12 md:gap-20 w-full opacity-0">

            <a href="mailto:envol.graphisme@gmail.com"
               data-i18n="contact_btn_email"
               class="w-64 sm:w-auto bg-[#7B94C8] hover:bg-[#DEE3F6] hover:text-[#1a2332] text-white
                      font-bold px-10 sm:px-14 py-4 sm:py-5 rounded-full text-center
                      text-[clamp(0.82rem,1.8vw,1.2rem)] tracking-wide
                      transition-all duration-300 shadow-xl
                      hover:scale-105 hover:shadow-[0_0_40px_rgba(123,148,200,0.6)]">
                M'ÉCRIRE MAINTENANT
            </a>

            <a href="#social"
               data-i18n="contact_btn_social"
               class="w-64 sm:w-auto bg-[#7B94C8] hover:bg-[#DEE3F6] hover:text-[#1a2332] text-white
                      font-bold px-10 sm:px-14 py-4 sm:py-5 rounded-full text-center
                      text-[clamp(0.82rem,1.8vw,1.2rem)] tracking-wide
                      transition-all duration-300 shadow-xl
                      hover:scale-105 hover:shadow-[0_0_40px_rgba(123,148,200,0.6)]">
                RÉSEAUX SOCIAUX
            </a>
        </div>
    </div>

    <!-- Chouette collée au bas de la section / au-dessus du footer -->
    <div class="absolute bottom-0 left-0 right-0 z-0 flex justify-center items-end overflow-visible pointer-events-none">
        <img src="../img/Chouetteailesouvertes.svg" alt=""
             class="w-[85%] sm:w-[65%] md:w-[55%] lg:w-[48%] max-w-[780px]
                    translate-y-[18%] select-none"
             loading="lazy" aria-hidden="true">
    </div>

</section>

<script src="../js/navbar.js"></script>
<script src="../js/footer.js"></script>
<style>
  footer { margin-top: 0 !important; }
</style>
<script src="../js/Parallax.js"></script>
<script src="../js/scroll-animations.js"></script>
<script src="../js/owl-FAQ.js"></script>
<script src="../i18n/i18n.js"></script>
<script>
(function(){
    function hideLoader(){var l=document.getElementById('page-loader');if(!l)return;l.classList.add('loader-out');setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},900);document.documentElement.style.overflow='';}
    if(document.readyState==='complete'){setTimeout(hideLoader,350);}
    else{window.addEventListener('load',function(){setTimeout(hideLoader,350);});}
    setTimeout(hideLoader,5000);
})();


document.addEventListener('DOMContentLoaded', function() {
    gsap.fromTo('#contact-h1',
        { opacity: 0, y: 60 },
        { opacity: 1, y: 0, duration: 1.1, ease: 'power3.out', delay: 0.4 }
    );
    gsap.fromTo('#contact-sub',
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', delay: 0.8 }
    );
    gsap.fromTo('#contact-btns',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out', delay: 1.2 }
    );
});
</script>
</body>
</html>
