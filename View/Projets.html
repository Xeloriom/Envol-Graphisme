<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Envol Graphisme - Projets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <style>
        /* Verrouillage strict anti-scroll horizontal */
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* Bloque le scroll du site quand la modale est ouverte */
        body.modal-open { overflow: hidden !important; }

        /* Scrollbar pro pour les colonnes internes */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #CB8D30; border-radius: 10px; }

        /* Correction du cadre mobile pour qu'il soit vertical comme l'image */
        @media (max-width: 1023px) {
            .modal-inner-frame {
                background-image: url('../img/Cadrejaunemobile.svg') !important;
                background-size: 100% 100%;
                width: 92%;
                height: 85vh;
                padding: 18% 10% 10% 10% !important;
            }
        }

        /* Cadre Desktop split */
        @media (min-width: 1024px) {
            .modal-inner-frame {
                background-image: url('../img/CadreJaune.svg') !important;
                background-size: contain;
                width: 100%;
                max-width: 1200px;
                height: 85vh;
                padding: 8% 10% !important;
            }
        }
    </style>
</head>
<body id="bienvenue" class="bg-[#1a2332] text-white">

<section id="projets" class="relative min-h-screen py-40 px-6 lg:px-20 overflow-hidden">
    <div class="absolute inset-0 bg-[url('../img/Motif%20étoiles%20blanches.svg')]
    bg-[length:700%] md:bg-[length:150%] bg-center opacity-10
    [mask-image:linear-gradient(to_top,rgba(0,0,0,0.8),rgba(0,0,0,0))]
    [-webkit-mask-image:linear-gradient(to_top,rgba(0,0,0,0.8),rgba(0,0,0,0))] pointer-events-none">
    </div>

    <div class="relative z-10 max-w-8xl mx-auto">
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 lg:gap-24 lg:gap-y-32 px-4">
        </div>
    </div>
</section>

<div id="project-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/85 p-2 overflow-hidden">

    <button id="back-arrow" class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 w-10 md:w-16 z-[110] transition-transform hover:scale-110">
        <svg class="text-[#CB8D30] rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>

    <div class="modal-inner-frame relative bg-no-repeat bg-center flex items-center justify-center overflow-hidden">

        <button id="close-modal" class="absolute top-4 right-4 md:top-[8%] md:right-[8%] w-10 md:w-14 z-[120] hover:rotate-90 transition-all">
            <img src="../img/CroixJaune.svg" class="w-full h-full" />
        </button>

        <div class="w-full h-full flex flex-col lg:flex-row gap-6 lg:gap-12 overflow-hidden">
            <div class="w-full lg:w-1/2 flex flex-col overflow-hidden">
                <h2 id="modal-title" class="text-2xl md:text-5xl font-extrabold text-[#42290D] uppercase mb-4 tracking-tighter"></h2>
                <div id="modal-description" class="text-[#42290D] text-sm md:text-base leading-relaxed overflow-y-auto custom-scroll pr-4">
                </div>
            </div>

            <div id="modal-images" class="w-full lg:w-1/2 overflow-y-auto custom-scroll flex lg:flex-col gap-6 pr-2">
            </div>
        </div>
    </div>

    <button id="next-arrow" class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 w-10 md:w-16 z-[110] transition-transform hover:scale-110">
        <svg class="text-[#CB8D30] -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>
</div>

<script src="../js/projets.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/footer.js"></script>
<script src="../js/Parallax.js"></script>
<script src="../js/owl-FAQ.js"></script>
<script src="../js/testimonial-slide.js"></script>
<script src="../i18n/i18n.js"></script>
<script src="../js/Swiper.js"></script>

</body>
</html>
