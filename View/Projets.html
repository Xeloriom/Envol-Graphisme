<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envol Graphisme - Design Parallax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="../style.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
</head>
<body class="bg-[#1a2332] text-white overflow-x-hidden">

<!-- La navigation sera injectée ici par navbar.js -->

<!-- Hero Section  -->
<section id="projets" class="relative min-h-screen py-40 px-6  ">

    <!-- Étoiles décoratives -->
    <div class="absolute h-[330em] lg:h-[430vw] xl:h-[130vw] inset-0 bg-[url('../img/Motif%20étoiles%20blanches.svg')] bg-cover bg-center opacity-10 [mask-image:linear-gradient(to_top,rgba(0,0,0,0.8),rgba(0,0,0,0))] [-webkit-mask-image:-webkit-gradient(linear,left_bottom,left_top,from(rgba(0,0,0,0.8)),to(rgba(0,0,0,0)))]"></div>


    <!-- Fond avec motif étoiles -->
    <div class="absolute inset-0 bg-[url('./img/Motif%20étoiles%20blanches.svg')] bg-cover bg-center opacity-10"></div>

    <div class="relative z-10 max-w-8xl mx-auto px-10">

        <!-- Grille de projets - sera remplie dynamiquement -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-24 gap-y-20">
            <!-- Les projets seront injectés ici par JavaScript -->
        </div>
    </div>

</section>

<!-- Modal pour afficher les détails du projet -->
<div id="project-modal" class="fixed inset-0 z-50 hidden bg-black/70 items-center justify-center w-screen h-screen project-card">
    <button id="back-arrow" class="absolute left-10 w-20 h-20 rotate-90 flex items-center justify-center  transition-all duration-300 z-10 ">
        <svg class="w-20 h-20 text-[#CB8D30]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>
    <div class="relative w-full h-full bg-[url('../img/CadreJaune.svg')] bg-contain bg-center bg-no-repeat p-[10%] ">

        <!-- Bouton fermer -->
        <button id="close-modal" class="absolute top-[5%] right-[7%] w-20 h-20  flex items-center justify-center  transition-all duration-300 z-10 ">
            <img class="w-full h-full text-white" src="../img/CroixJaune.svg">
        </button>

        <!-- Contenu du modal -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 p-12 ">
            <!-- Colonne gauche - Texte -->
            <div class="space-y-6 ">
                <h2 id="modal-title" class="text-5xl font-medium text-[#42290D] mb-8"></h2>
                <div id="modal-description" class="space-y-4 text-[#42290D] text-lg leading-relaxed">
                    <!-- Description sera injectée ici -->
                </div>
            </div>

            <!-- Colonne droite - Images -->
            <div id="modal-images" class="space-y-6 overflow-y-auto h-[84%] p-10">
                <!-- Images seront injectées ici -->
            </div>
        </div>
    </div>
    <button id="next-arrow" class="absolute right-10 w-20 h-20 -rotate-90 flex items-center justify-center  transition-all duration-300 z-10 ">
        <svg class="w-20 h-20 text-[#CB8D30]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>
</div>

<!-- Fichier 3: projects-loader.js - À placer dans /js/projects-loader.js -->
<script src="../js/projets.js"></script>

<script src="../js/navbar.js"></script>
<script src="../js/footer.js"></script>
<script src="../js/Parallax.js"></script>
<script src="../js/owl-FAQ.js"></script>
<script src="../js/testimonial-slide.js"></script>

<script src="../i18n/i18n.js"></script>

<script src="../js/Swiper.js"></script>

</body>
</html>
