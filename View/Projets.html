    <style>
        html, body { max-width:100vw; overflow-x:hidden; }
        body.modal-open {
            overflow: hidden !important;
            scrollbar-width: none;
        }
        body.modal-open::-webkit-scrollbar { display: none; }
        /* Scrollbar invisible par défaut, visible au survol */
        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            transition: scrollbar-color 0.3s;
        }
        .custom-scroll:hover {
            scrollbar-color: rgba(203,141,48,0.5) transparent;
        }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 99px;
            transition: background 0.3s;
        }
        .custom-scroll:hover::-webkit-scrollbar-thumb {
            background: rgba(203,141,48,0.5);
        }

        /* ── Cadre modal commun */
        .modal-inner-frame {
            position: relative;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ── Mobile ≤ 1023px : card propre sans image de fond */
        @media (max-width:1023px) {
            #project-modal {
                padding-top: max(0.5rem, env(safe-area-inset-top));
                padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
                padding-left: max(0.5rem, env(safe-area-inset-left));
                padding-right: max(0.5rem, env(safe-area-inset-right));
            }
            .modal-inner-frame {
                background-image: none !important;
                background-color: #EDE5C8;
                border: 3px solid #CB8D30;
                border-radius: 1.5rem;
                width: 92%;
                max-height: min(88dvh, calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 1rem));
                height: auto;
                padding: 3rem 1.2rem 1.5rem !important;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            }
            #close-modal {
                top: 0.75rem !important; right: 0.75rem !important;
                width: 2rem !important;
            }
            #modal-title { font-size: 1.1rem; margin-bottom: 0.5rem; }
            #modal-description { font-size: 0.82rem; }
        }

        /* ── Très petit mobile ≤ 390px */
        @media (max-width:390px) {
            .modal-inner-frame {
                width: 96% !important;
                padding: 2.8rem 1rem 1.2rem !important;
            }
            #modal-title { font-size: 0.95rem !important; }
            #modal-description { font-size: 0.75rem !important; }
        }

        /* ── Écran court / paysage (hauteur ≤ 600px) */
        @media (max-height:600px) {
            .modal-inner-frame {
                max-height: min(95dvh, calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))) !important;
                padding-top: 2.5rem !important;
            }
        }

        /* ── Desktop ≥ 1024px */
        @media (min-width:1024px) {
            .modal-inner-frame {
                background-image: url('../img/CadreJaune.svg') !important;
                background-size: 100% 100%;
                width: 92%; max-width: 1200px; height: 88vh;
                padding: 9% 8% 9% 8% !important;
            }
        }

        /* ── Large ≥ 1536px */
        @media (min-width:1536px) {
            .modal-inner-frame {
                max-width: 1400px;
                padding: 8% 7% !important;
            }
        }

        /* ── Typographie titre modal */
        #modal-title { font-size: clamp(1rem, 2.5vw, 2.2rem); }

        /* ── Description */
        #modal-description { font-size: clamp(0.75rem, 1.4vw, 1rem); }
        #modal-description p { margin-bottom: 0.6rem; }

        /* ── Images dans le modal */
        #modal-images img { border-radius: 1.5rem; width: 100%; object-fit: cover; }

        /* ── Layout mobile : images en scroll horizontal */
        @media (max-width:1023px) {
            .modal-body { flex-direction: column; height: 100%; overflow: hidden; gap: 0.5rem; }
            .modal-text { max-height: 50%; flex-shrink: 0; overflow: hidden; display: flex; flex-direction: column; }
            #modal-description { flex: 1; min-height: 0; overflow-y: auto; }
            .modal-images {
                flex-direction: row !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                flex-shrink: 0;
                flex: 1;
                min-height: 0;
            }
            .modal-images img { width: auto; height: 100%; flex-shrink: 0; border-radius: 1rem; }
        }
    </style>
</head>
<body id="bienvenue" class="bg-[#1a2332] text-white">

<a href="#projets" class="skip-link">Aller au contenu principal</a>

<section id="projets" class="relative min-h-screen pt-28 sm:pt-32 lg:pt-36 pb-16 sm:pb-20 px-3 sm:px-6 lg:px-16 overflow-hidden">

    <div class="absolute inset-0 bg-[url('../img/Motif%20étoiles%20blanches.svg')]
                bg-[length:700%] md:bg-[length:150%] bg-center opacity-10
                [mask-image:linear-gradient(to_top,rgba(0,0,0,0.8),rgba(0,0,0,0))]
                pointer-events-none" aria-hidden="true"></div>

    <div class="relative z-10 max-w-7xl mx-auto">
        <div id="projects-grid"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-y-16 gap-x-6 sm:gap-10 lg:gap-14 px-8 sm:px-4"
             role="list">
        </div>
    </div>
</section>

<!-- MODALE -->
<div id="project-modal"
     class="fixed inset-0 z-[1100] hidden items-center justify-center bg-black/85 overflow-hidden"
     role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button id="back-arrow"
            class="absolute left-0 sm:left-2 md:left-4 top-1/2 -translate-y-1/2 w-10 sm:w-16 md:w-24 z-[1110] transition-transform hover:scale-110 active:scale-95"
            aria-label="Projet précédent">
        <svg class="text-[#CB8D30] rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
    <div class="modal-inner-frame relative bg-no-repeat bg-center flex items-center justify-center overflow-hidden">
        <button id="close-modal"
                class="absolute top-[6.5%] right-[5%] w-14 md:w-16 z-[1120] hover:rotate-90 transition-all duration-300"
                aria-label="Fermer">
            <img src="../img/CroixJaune.svg" class="w-full h-full" alt="">
        </button>

        <!-- Desktop : côte à côte -->
        <div class="modal-body w-full h-full flex flex-col lg:flex-row gap-4 lg:gap-10">
            <div class="modal-text w-full lg:w-1/2 flex flex-col overflow-hidden">
                <h2 id="modal-title" class="font-extrabold text-[#42290D] uppercase tracking-tighter mb-2 shrink-0"></h2>
                <div id="modal-description" class="text-[#42290D] leading-relaxed overflow-y-auto custom-scroll pr-1 flex-1"></div>
            </div>
            <div id="modal-images" class="modal-images w-full lg:w-1/2 overflow-y-auto custom-scroll flex lg:flex-col gap-3"></div>
        </div>
    </div>
    <button id="next-arrow"
            class="absolute right-0 sm:right-2 md:right-4 top-1/2 -translate-y-1/2 w-10 sm:w-16 md:w-24 z-[1110] transition-transform hover:scale-110 active:scale-95"
            aria-label="Projet suivant">
        <svg class="text-[#CB8D30] -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
</div>

<script src="../js/navbar.js"></script>
<script src="../js/projets.js"></script>
<script src="../js/scroll-animations.js"></script>
<script src="../js/footer.js"></script>
<script src="../js/Parallax.js"></script>
<script src="../js/owl-FAQ.js"></script>
<script src="../i18n/i18n.js"></script>
<script>
(function(){
    function hideLoader(){var l=document.getElementById('page-loader');if(!l)return;l.classList.add('loader-out');setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},900);document.documentElement.style.overflow='';}
    if(document.readyState==='complete'){setTimeout(hideLoader,350);}
    else{window.addEventListener('load',function(){setTimeout(hideLoader,350);});}
    setTimeout(hideLoader,5000);
})();


document.addEventListener('DOMContentLoaded', function() {
    gsap.fromTo('.projets-h1',   { opacity:0, y:40 }, { opacity:1, y:0, duration:0.55, ease:'power3.out', delay:0.2 });
    gsap.fromTo('.projets-sub',  { opacity:0, y:20 }, { opacity:1, y:0, duration:0.4,  ease:'power3.out', delay:0.4 });
    gsap.fromTo('.projets-line', { opacity:0 },        { opacity:1,      duration:0.35,                   delay:0.55 });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
});
</script>
</body>
</html>
