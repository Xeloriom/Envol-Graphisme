<body id="bienvenue" class="bg-[#1a2332] text-white">

<a href="#projets" class="skip-link">Aller au contenu principal</a>

<section id="projets" class="relative min-h-screen py-40 px-6 lg:px-20 overflow-hidden"
         aria-label="Portfolio de projets">

    <div class="absolute inset-0
                bg-[url('../img/Motif%20étoiles%20blanches.svg')]
                bg-[length:700%] md:bg-[length:150%] bg-center opacity-10
                [mask-image:linear-gradient(to_top,rgba(0,0,0,0.8),rgba(0,0,0,0))]
                [-webkit-mask-image:linear-gradient(to_top,rgba(0,0,0,0.8),rgba(0,0,0,0))]

         aria-hidden="true">
    </div>

    <div class="relative z-10 max-w-8xl mx-auto">
        <h1 class="text-[clamp(1.8rem,4vw,3rem)] font-bold text-center mb-16 text-[#DEE3F6]"
            data-aos="fade-down">
            Mes créations
        </h1>
        <div id="projects-grid"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10 lg:gap-16 px-4"
             role="list">
        </div>
    </div>
</section>

<!-- ══ MODALE PROJET ══ -->
<div id="project-modal"
     class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/85 p-2 overflow-hidden"
     role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <button id="back-arrow"
            class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 w-10 md:w-16 z-[110] transition-transform hover:scale-110"
            aria-label="Projet précédent">
        <svg class="text-[#CB8D30] rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>

    <div class="modal-inner-frame relative bg-no-repeat bg-center flex items-center justify-center overflow-hidden">

        <button id="close-modal"
                class="absolute top-4 right-4 md:top-[8%] md:right-[8%] w-10 md:w-14 z-[120] hover:rotate-90 transition-all"
                aria-label="Fermer le projet">
            <img src="../img/CroixJaune.svg" class="w-full h-full" alt="">
        </button>

        <div class="w-full h-full flex flex-col lg:flex-row gap-6 lg:gap-12 overflow-hidden">
            <div class="w-full lg:w-1/2 flex flex-col overflow-hidden">
                <h2 id="modal-title"
                    class="text-2xl md:text-5xl font-extrabold text-[#42290D] uppercase mb-4 tracking-tighter">
                </h2>
                <div id="modal-description"
                     class="text-[#42290D] text-sm md:text-base leading-relaxed overflow-y-auto custom-scroll pr-4">
                </div>
            </div>
            <div id="modal-images"
                 class="w-full lg:w-1/2 overflow-y-auto custom-scroll flex lg:flex-col gap-6 pr-2">
            </div>
        </div>
    </div>

    <button id="next-arrow"
            class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 w-10 md:w-16 z-[110] transition-transform hover:scale-110"
            aria-label="Projet suivant">
        <svg class="text-[#CB8D30] -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
</div>
